name: Native embedding

on:
  pull_request:
    paths:
      - ".github/workflows/native-embedding.yml"
      - "native/**"
      - "scripts/android-release/**"
      - ".github/workflows/android-release.yml"
      - "Package.swift"
      - "package.json"
      - "src/**"
      - "demo/tests/native-embedding/**"
      - "demo/tests/native/android-socket-eof/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-embedding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify probe deadlines
        run: node --test demo/tests/native-embedding/ios/deadline.test.mjs
      - name: Boot an available iPhone simulator
        run: |
          device=$(xcrun simctl list devices available --json | node -e 'let data="";process.stdin.on("data",c=>data+=c);process.stdin.on("end",()=>{const d=Object.values(JSON.parse(data).devices).flat().find(d=>d.name.startsWith("iPhone"));if(!d)process.exit(1);console.log(d.udid)})')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "WORKERS_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Verify independent UIKit and SwiftUI consumer
        env:
          WORKERS_IOS_PROBE_DIR: ${{ runner.temp }}/workers-ios-acceptance
        run: |
          node demo/tests/native-embedding/ios/run.mjs "$WORKERS_SIMULATOR"
          node demo/tests/native-embedding/ios/run.mjs "$WORKERS_SIMULATOR" startup-failure
          node demo/tests/native-embedding/ios/run.mjs "$WORKERS_SIMULATOR" broken-entry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-embedding
          path: ${{ runner.temp }}/workers-ios-acceptance/*.log
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm run build
      - name: Verify standalone Maven publication and consumer
        run: |
          node --test scripts/android-release/publish.test.mjs
          python3 scripts/android-release/verify.py
          demo/android/gradlew -p demo/tests/native-embedding/android -PsdkRepository="$GITHUB_WORKSPACE/scripts/android-release/build/repository" :app:assembleDebug --console=plain
      - name: Verify TLS inbound EOF ordering
        run: python3 demo/tests/native/android-socket-eof/run.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify independent ComponentActivity consumer
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: node demo/tests/native-embedding/android/run.mjs emulator-5554
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-embedding
          path: demo/tests/native-embedding/android/build/acceptance/
